# Cluster config file : Mapping kong's Nodeport-31080 to hostport 8082
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 31080
        hostPort: 8082     # NGINX
      - containerPort: 32443
        hostPort: 8444     # NGINX TLS
      - containerPort: 30080
        hostPort: 8080     # Kong HTTP
      - containerPort: 30443
        hostPort: 8443     # Kong HTTPS (optional)